name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Artel Worlds
        # immediate strategy: one machine with a volume, so a rolling deploy has nowhere to
        # place the new machine. Recreate in place.
        run: flyctl deploy --app artel-worlds --remote-only --yes --strategy immediate
        env:
          FLY_API_TOKEN: }
